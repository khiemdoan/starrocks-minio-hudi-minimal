services:
  starrocks-fe:
    image: starrocks/fe-ubuntu:3.5-latest
    restart: unless-stopped
    container_name: starrocks-fe
    hostname: starrocks-fe
    command:
      - /bin/bash
      - -c
      - |
        echo "# enable shared data, set storage type, set endpoint" >> /opt/starrocks/fe/conf/fe.conf
        echo "run_mode = shared_data" >> /opt/starrocks/fe/conf/fe.conf
        echo "cloud_native_storage_type = S3" >> /opt/starrocks/fe/conf/fe.conf
        echo "aws_s3_endpoint = minio:9000" >> /opt/starrocks/fe/conf/fe.conf

        echo "# set the path in MinIO" >> /opt/starrocks/fe/conf/fe.conf
        echo "aws_s3_path = starrocks" >> /opt/starrocks/fe/conf/fe.conf

        echo "# credentials for MinIO object read/write" >> /opt/starrocks/fe/conf/fe.conf
        echo "aws_s3_access_key = ${MINIO_ACCESS_KEY}" >> /opt/starrocks/fe/conf/fe.conf
        echo "aws_s3_secret_key = ${MINIO_SECRET_KEY}" >> /opt/starrocks/fe/conf/fe.conf
        echo "aws_s3_use_instance_profile = false" >> /opt/starrocks/fe/conf/fe.conf
        echo "aws_s3_use_aws_sdk_default_behavior = false" >> /opt/starrocks/fe/conf/fe.conf

        echo "# Set this to false if you do not want default" >> /opt/starrocks/fe/conf/fe.conf
        echo "# storage created in the object storage using" >> /opt/starrocks/fe/conf/fe.conf
        echo "# the details provided above" >> /opt/starrocks/fe/conf/fe.conf
        echo "enable_load_volume_from_conf = true" >> /opt/starrocks/fe/conf/fe.conf

        /opt/starrocks/fe/bin/start_fe.sh --host_type FQDN
    ports:
      - 8030:8030/tcp
      - 9020:9020/tcp
      - 9030:9030/tcp
    volumes:
      - .data/starrocks:/opt/starrocks/fe/meta
    healthcheck:
      test: curl -f -s -o /dev/null -w '%{http_code}' http://localhost:8030 | grep 401
      interval: 60s
      timeout: 1s
      retries: 3
      start_period: 1s
      start_interval: 1s
    depends_on:
      starrocks-cn:
        condition: service_healthy
      minio:
        condition: service_healthy

  starrocks-cn:
    image: starrocks/cn-ubuntu:3.5-latest
    restart: unless-stopped
    container_name: starrocks-cn
    hostname: starrocks-cn
    command: /opt/starrocks/cn/bin/start_cn.sh
    environment:
      - HOST_TYPE=FQDN
    ports:
      - 8040:8040/tcp
    ulimits:
      nproc: 65535
      nofile:
        soft: 655350
        hard: 655350
    healthcheck:
      test: curl -f http://localhost:8040
      interval: 60s
      timeout: 1s
      retries: 3
      start_period: 1s
      start_interval: 1s

  hive-metastore:
    image: apache/hive:3.1.3
    restart: unless-stopped
    container_name: hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      IS_RESUME: true
      SERVICE_OPTS: |
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/${POSTGRES_DATABASE}
        -Djavax.jdo.option.ConnectionUserName=${POSTGRES_USER}
        -Djavax.jdo.option.ConnectionPassword=${POSTGRES_PASSWORD}
    ports:
      - 9083:9083/tcp
    volumes:
      - ./hive_conf/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./hive_libraries/apache-client-2.32.16.jar:/opt/hive/lib/apache-client-2.32.16.jar:ro
      - ./hive_libraries/auth-2.32.16.jar:/opt/hive/lib/auth-2.32.16.jar:ro
      - ./hive_libraries/aws-core-2.32.16.jar:/opt/hive/lib/aws-core-2.32.16.jar:ro
      - ./hive_libraries/aws-query-protocol-2.32.16.jar:/opt/hive/lib/aws-query-protocol-2.32.16.jar:ro
      - ./hive_libraries/aws-xml-protocol-2.32.16.jar:/opt/hive/lib/aws-xml-protocol-2.32.16.jar:ro
      - ./hive_libraries/checksums-2.32.16.jar:/opt/hive/lib/checksums-2.32.16.jar:ro
      - ./hive_libraries/checksums-spi-2.32.16.jar:/opt/hive/lib/checksums-spi-2.32.16.jar:ro
      - ./hive_libraries/endpoints-spi-2.32.16.jar:/opt/hive/lib/endpoints-spi-2.32.16.jar:ro
      - ./hive_libraries/hadoop-auth-3.4.1.jar:/opt/hive/lib/hadoop-auth-3.4.1.jar:ro
      - ./hive_libraries/hadoop-aws-3.4.1.jar:/opt/hive/lib/hadoop-aws-3.4.1.jar:ro
      - ./hive_libraries/hadoop-common-3.4.1.jar:/opt/hive/lib/hadoop-common-3.4.1.jar:ro
      - ./hive_libraries/hadoop-shaded-guava-1.4.0.jar:/opt/hive/lib/hadoop-shaded-guava-1.4.0.jar:ro
      - ./hive_libraries/http-auth-2.32.15.jar:/opt/hive/lib/http-auth-2.32.15.jar:ro
      - ./hive_libraries/http-auth-aws-2.32.15.jar:/opt/hive/lib/http-auth-aws-2.32.15.jar:ro
      - ./hive_libraries/http-auth-spi-2.32.16.jar:/opt/hive/lib/http-auth-spi-2.32.16.jar:ro
      - ./hive_libraries/http-client-spi-2.32.16.jar:/opt/hive/lib/http-client-spi-2.32.16.jar:ro
      - ./hive_libraries/identity-spi-2.32.16.jar:/opt/hive/lib/identity-spi-2.32.16.jar:ro
      - ./hive_libraries/json-utils-2.32.16.jar:/opt/hive/lib/json-utils-2.32.16.jar:ro
      - ./hive_libraries/metrics-spi-2.32.16.jar:/opt/hive/lib/metrics-spi-2.32.16.jar:ro
      - ./hive_libraries/postgresql-42.7.7.jar:/opt/hive/lib/postgresql-42.7.7.jar:ro
      - ./hive_libraries/profiles-2.32.15.jar:/opt/hive/lib/profiles-2.32.15.jar:ro
      - ./hive_libraries/protocol-core-2.32.16.jar:/opt/hive/lib/protocol-core-2.32.16.jar:ro
      - ./hive_libraries/reactive-streams-1.0.4.jar:/opt/hive/lib/reactive-streams-1.0.4.jar:ro
      - ./hive_libraries/regions-2.32.16.jar:/opt/hive/lib/regions-2.32.16.jar:ro
      - ./hive_libraries/retries-2.32.16.jar:/opt/hive/lib/retries-2.32.16.jar:ro
      - ./hive_libraries/retries-spi-2.32.16.jar:/opt/hive/lib/retries-spi-2.32.16.jar:ro
      - ./hive_libraries/s3-2.32.16.jar:/opt/hive/lib/s3-2.32.16.jar:ro
      - ./hive_libraries/s3-transfer-manager-2.32.15.jar:/opt/hive/lib/s3-transfer-manager-2.32.15.jar:ro
      - ./hive_libraries/sdk-core-2.32.16.jar:/opt/hive/lib/sdk-core-2.32.16.jar:ro
      - ./hive_libraries/third-party-jackson-core-2.32.15.jar:/opt/hive/lib/third-party-jackson-core-2.32.15.jar:ro
      - ./hive_libraries/utils-2.32.16.jar:/opt/hive/lib/utils-2.32.16.jar:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: bash -c 'echo > /dev/tcp/127.0.0.1/9083'
      interval: 60s
      timeout: 1s
      retries: 3
      start_period: 1s
      start_interval: 1s

  postgres:
    image: docker.io/library/postgres:17.5
    restart: unless-stopped
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    volumes:
      - .data/postgres:/var/lib/postgresql/data:Z
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}
      interval: 60s
      timeout: 1s
      retries: 3
      start_period: 1s
      start_interval: 1s

  minio_mc:
    # This service is short lived, it does this:
    # - starts up
    # - checks to see if the MinIO service `minio` is ready
    # - creates a MinIO Access Key that the StarRocks services will use
    # - exits
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: minio-mc
    entrypoint:
      - sh
      - -c
      - |
        until mc ls minio > /dev/null 2>&1; do
          sleep 0.5
        done

        mc alias set myminio http://minio:9000 ${MINIO_USER} ${MINIO_PASSWORD}
        mc admin user svcacct add \
        --access-key ${MINIO_ACCESS_KEY} \
        --secret-key ${MINIO_SECRET_KEY} \
        myminio ${MINIO_USER}
        mc mb -p myminio/starrocks
    depends_on:
      minio:
        condition: service_healthy

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - 9001:9001/tcp
      - 9000:9000/tcp
    command: server /data --console-address ":9001"
    volumes:
      - .data/minio:/data
    healthcheck:
      test: mc ready local
      interval: 60s
      timeout: 1s
      retries: 3
      start_period: 1s
      start_interval: 1s
